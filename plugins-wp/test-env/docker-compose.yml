version: '3.8'

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp
      MYSQL_PASSWORD: wp_secret
      MYSQL_ROOT_PASSWORD: root_secret
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      interval: 10s
      retries: 5

  wordpress:
    image: wordpress:6.5-php8.1-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp_secret
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('SCRIPT_DEBUG', false);
    volumes:
      - wp_data:/var/www/html
      - ../content-audit-cleanup:/var/www/html/wp-content/plugins/content-audit-cleanup
      - ../geo-metodo-seo:/var/www/html/wp-content/plugins/geo-metodo-seo
      - ./setup:/docker-entrypoint-initwp.d
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/wp-admin/install.php"]
      interval: 15s
      retries: 10
      start_period: 30s

  wpcli:
    image: wordpress:cli-2.10-php8.1
    depends_on:
      wordpress:
        condition: service_healthy
    user: "33:33"
    volumes:
      - wp_data:/var/www/html
      - ../content-audit-cleanup:/var/www/html/wp-content/plugins/content-audit-cleanup
      - ../geo-metodo-seo:/var/www/html/wp-content/plugins/geo-metodo-seo
      - ./setup:/setup
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp_secret
      WORDPRESS_DB_NAME: wordpress
    command: >
      sh -c "
        echo 'Aguardando WordPress...' &&
        sleep 20 &&
        wp core install
          --url=http://localhost:8080
          --title='Teste CAC'
          --admin_user=admin
          --admin_password=admin123
          --admin_email=test@example.com
          --skip-email
          --allow-root 2>/dev/null || true &&
        wp plugin activate content-audit-cleanup --allow-root &&
        wp eval 'require \"/setup/fixtures.php\";' --allow-root &&
        echo 'Setup completo. Acesse http://localhost:8080/wp-admin (admin / admin123)'
      "

volumes:
  db_data:
  wp_data:
